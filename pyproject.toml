# Tool settings only: the simulator runs from the repository root (see README).

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["environment"]     # generated by the room exporter: replaced as a whole, not edited

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = [
    "B905",   # zip() without strict=: zip(points, points[1:]) pairs are intentional
    "E731",   # small lambdas assigned to names are used deliberately in or_scene
]
